services:
  agent:
    build:
      context: ..
      dockerfile: .agent/Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - GIT_USER_NAME
      - GIT_USER_EMAIL
    volumes:
      - ..:/workspace
      - agent-home:/home/agent
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  agent-home:
